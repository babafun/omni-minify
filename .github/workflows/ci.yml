name: CI/CD Pipeline

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # Modern enterprise approach: use specialized actions for tool installation
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Run standard check
        run: cargo check --workspace --all-targets

      - name: Run cargo deny
        run: cargo deny check
        continue-on-error: true

      - name: Run cargo audit
        run: cargo audit
        continue-on-error: true

  testjob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run cargo test
        run: cargo test --workspace

      - name: Run tarpaulin
        # Aggregates coverage for the entire workspace
        run: cargo tarpaulin --workspace --fail-under 80 --ignore-tests

  build_test_deploy:
    runs-on: ubuntu-latest
    needs: [lint, testjob]
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install cargo-chef
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-chef

      - name: Cargo Chef Prepare
        run: cargo chef prepare --recipe-path recipe.json

      - name: Cache cargo chef build
        uses: actions/cache@v4
        with:
          path: target
          key: chef-target-${{ runner.os }}-${{ hashFiles('recipe.json') }}

      - name: Cargo Chef Cook
        run: cargo chef cook --release --recipe-path recipe.json

      - name: Build Workspace
        run: cargo build --release --workspace

name: CI/CD Pipeline

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # Cache the entire target folder for workspace speed
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo tools
        run: |
          mkdir -p ~/.cargo/bin
          # Use specific versions for enterprise stability instead of 'latest'
          curl -sL https://github.com/RustSec/rustsec/releases/latest/download/cargo-audit-x86_64-unknown-linux-gnu.tar.gz | tar xz -C ~/.cargo/bin/
          curl -sL https://github.com/EmbarkStudios/cargo-deny/releases/latest/download/cargo-deny-x86_64-unknown-linux-gnu.tar.gz | tar xz -C ~/.cargo/bin/
          chmod +x ~/.cargo/bin/*

      # Workspace wide checks
      - name: Run standard check
        run: cargo check --workspace --all-targets

      - name: Run cargo deny
        run: cargo deny check
        continue-on-error: true

      - name: Run cargo audit
        run: cargo audit
        continue-on-error: true

  testjob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-tarpaulin
        run: |
          curl -sL https://github.com/xd009642/tarpaulin/releases/latest/download/cargo-tarpaulin-x86_64-unknown-linux-gnu.tar.gz | tar xz -C ~/.cargo/bin/
          chmod +x ~/.cargo/bin/cargo-tarpaulin

      # Run tests for all members of the workspace
      - name: Run cargo test
        run: cargo test --workspace

      # Coverage across the entire workspace
      - name: Run tarpaulin
        run: cargo tarpaulin --workspace --fail-under 80 --ignore-tests

  build_test_deploy:
    runs-on: ubuntu-latest
    needs: [lint, testjob]
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install cargo-chef
        run: |
          curl -fsLo ~/.cargo/bin/cargo-chef https://github.com/LukeMathWalker/cargo-chef/releases/latest/download/cargo-chef-x86_64-unknown-linux-gnu
          chmod +x ~/.cargo/bin/cargo-chef

      # CHEF WORKSPACE STRATEGY
      - name: Cargo Chef Prepare
        run: cargo chef prepare --recipe-path recipe.json

      - name: Cache cargo chef build
        uses: actions/cache@v4
        with:
          path: target
          key: chef-target-${{ runner.os }}-${{ hashFiles('recipe.json') }}

      - name: Cargo Chef Cook
        run: cargo chef cook --release --recipe-path recipe.json

      # Final build of all binaries in the workspace
      - name: Build Workspace
        run: cargo build --release --workspace

# Enterprise-grade rustfmt configuration for omni-minify
# Focuses on consistency, readability, and maintainability
# Uses only stable rustfmt features

# Use hard tabs for indentation (4-space width equivalent)
hard_tabs = true
tab_spaces = 4

# Line length and wrapping
max_width = 100

# Function and struct formatting
fn_params_layout = "Tall"

# Spacing and alignment
use_small_heuristics = "Default"

# Documentation and attributes
merge_derives = true
use_try_shorthand = false
edition = "2021"

# Performance-oriented settings
single_line_if_else_max_width = 50
chain_width = 60

# Error handling and control flow
match_arm_leading_pipes = "Never"
match_block_trailing_comma = false

# Advanced formatting options
force_explicit_abi = true